name: 打包并发布插件 zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包插件
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${{ github.event.repository.name }}"
          STAGE="dist/$REPO_NAME"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'config.toml' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.zip' \
            --exclude '_selftest.py' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            ./ "$STAGE/"
          (cd dist && zip -qr "../$REPO_NAME.zip" "$REPO_NAME")
          echo "打包完成：$REPO_NAME.zip"
          ls -la "$REPO_NAME.zip"

      - name: 发布 Release 并挂 zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.event.repository.name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物（手动触发时便于下载验证）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-zip
          path: ${{ github.event.repository.name }}.zip
